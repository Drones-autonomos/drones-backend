name: Backend Container (Build and Smoke Test)

on:
  pull_request:
    branches: [ "main", "develop" ]
  push:
    branches: [ "main" ]

jobs:
  docker-build-check:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verificar construcción de imagen Docker
        # Solo verificamos que la imagen construya correctamente.
        # Más adelante se puede agregar login y push a un Registry.
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: drones-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Comprobar arranque HTTP de la imagen
        shell: bash
        run: |
          export SECRET_KEY="$(openssl rand -hex 32)"
          docker run --rm -e SECRET_KEY -e DATABASE_URL=sqlite:///:memory: \
            drones-backend:latest python -c \
            'from app.services.drone_service import _require_dronekit; _require_dronekit()'
          docker run -d --name drones-smoke -p 127.0.0.1:8000:8000 \
            -e SECRET_KEY -e DATABASE_URL=sqlite:///:memory: drones-backend:latest
          trap 'docker logs drones-smoke; docker rm -f drones-smoke' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/; then
              exit 0
            fi
            sleep 1
          done
          exit 1
