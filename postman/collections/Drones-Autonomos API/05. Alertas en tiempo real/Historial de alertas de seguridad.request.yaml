$kind: http-request
description: Retorna el listado de alertas generadas con filtros por estado de lectura y nivel de criticidad. Accesible por Guardia y Admin.
url: "{{baseUrl}}/api/v1/alerts/?leida=true&nivel_criticidad=string&skip=0&limit=50"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: leida
    value: "true"
    description: Filtrar por alertas leídas (true) o no leídas (false)
  - key: nivel_criticidad
    value: string
    description: Filtrar por criticidad (ej. ALTA, CRITICA)
  - key: skip
    value: "0"
    description: Número de registros a omitir para paginación
  - key: limit
    value: "50"
    description: Cantidad máxima de alertas a retornar
auth:
  type: oauth2
  credentials:
    accessTokenUrl: /api/v1/auth/login
    grant_type: password_credentials
scripts:
  - type: afterResponse
    code: "const data = pm.response.json();\r

      const list = Array.isArray(data) ? data : (data.items || []);\r

      if (list.length) pm.collectionVariables.set(\"alert_id\", list[0].id);"
    language: text/javascript
settings: {}
examples: .resources/Historial de alertas de seguridad.resources/examples
order: 1000
