$kind: http-request
description: Retorna la información de la alerta junto con el evento asociado, coordenadas y evidencias visuales (frames).
url: "{{baseUrl}}/api/v1/alerts/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: "{{alert_id}}"
    description: ""
auth:
  type: oauth2
  credentials:
    accessTokenUrl: /api/v1/auth/login
    grant_type: password_credentials
settings: {}
examples: .resources/Detalle completo de una alerta.resources/examples
order: 2000
