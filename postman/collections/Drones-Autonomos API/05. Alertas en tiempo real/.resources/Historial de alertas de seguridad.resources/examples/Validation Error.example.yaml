$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/alerts/?leida=true&nivel_criticidad=string&skip=0&limit=50"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
  queryParams:
    - key: leida
      value: "true"
      description: Filtrar por alertas leídas (true) o no leídas (false)
    - key: nivel_criticidad
      value: string
      description: Filtrar por criticidad (ej. ALTA, CRITICA)
    - key: skip
      value: "0"
      description: Número de registros a omitir para paginación
    - key: limit
      value: "50"
      description: Cantidad máxima de alertas a retornar
response:
  statusCode: 422
  statusText: Unprocessable Entity (WebDAV) (RFC 4918)
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "detail": [
          {
            "loc": [
              3174,
              "string"
            ],
            "msg": "string",
            "type": "string",
            "input": "",
            "ctx": {}
          },
          {
            "loc": [
              7682,
              "string"
            ],
            "msg": "string",
            "type": "string",
            "input": "",
            "ctx": {}
          }
        ]
      }
order: 2000
