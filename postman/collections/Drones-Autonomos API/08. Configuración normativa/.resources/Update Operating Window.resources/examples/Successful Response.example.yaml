$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/settings/operating-window"
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
  body:
    type: json
    content: |-
      {
        "altitud_maxima_m": 200,
        "peso_maximo_kg": 5,
        "hora_apertura": "06:00",
        "hora_cierre": "23:00"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "altitud_maxima_m": 200,
        "peso_maximo_kg": 5,
        "hora_apertura": "06:00",
        "hora_cierre": "23:00"
      }
order: 1000
