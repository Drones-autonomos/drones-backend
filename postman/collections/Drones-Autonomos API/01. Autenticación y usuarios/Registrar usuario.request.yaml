$kind: http-request
description: Crea un usuario con rol asignado. Requiere ADMIN; el primer administrador se crea por CLI.
url: "{{baseUrl}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "nombre": "string",
      "email": "MoZmJ-pVVJsupW@DtJlyPybwYE.yz",
      "password": "string",
      "rol_id": 172
    }
auth:
  type: oauth2
  credentials:
    accessTokenUrl: /api/v1/auth/login
    grant_type: password_credentials
settings: {}
examples: .resources/Registrar usuario.resources/examples
order: 1000
