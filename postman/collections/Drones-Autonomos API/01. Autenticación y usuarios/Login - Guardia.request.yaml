$kind: http-request
description: Valida credenciales y retorna un token Bearer JWT con tiempo de expiración.
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "email": "guardia@facultad.edu.mx",
      "password": "PasswordSegura123!"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: "pm.test(\"Status 200 - Login Guardia exitoso\", function () {\r

      \    pm.response.to.have.status(200);\r

      \    const data = pm.response.json();\r

      \    pm.environment.set(\"guardia_token\", data.access_token);\r

      \    pm.collectionVariables.set(\"guardia_token\", data.access_token);\r

      });"
    language: text/javascript
settings: {}
examples: .resources/Login - Guardia.resources/examples
order: 2000
