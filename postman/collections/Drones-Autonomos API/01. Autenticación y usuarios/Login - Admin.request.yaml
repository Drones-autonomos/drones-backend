$kind: http-request
description: Valida credenciales y retorna un token Bearer JWT con tiempo de expiración.
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
        "email": "admin@facultad.edu.mx",
        "password": "PsswrdSegura123!"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: "pm.test(\"Login admin correcto\", () => pm.response.to.have.status(200));\r

      pm.collectionVariables.set(\"admin_token\", pm.response.json().access_token);"
    language: text/javascript
settings: {}
examples: .resources/Login - Admin.resources/examples
order: 1166
