$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/auth/me"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": 4858,
        "nombre": "string",
        "email": "vZtomM2tVe6ICtL@CpIljJFftJvZWNSbrb.fs",
        "activo": false,
        "rol": {
          "nombre": "string",
          "id": 6344,
          "descripcion": "string"
        },
        "created_at": "1995-11-16T18:52:56.109Z"
      }
order: 1000
