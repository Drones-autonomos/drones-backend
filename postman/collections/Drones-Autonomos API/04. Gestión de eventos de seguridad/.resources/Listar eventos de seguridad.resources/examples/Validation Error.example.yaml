            ],
            "msg": "string",
            "type": "string",
            "input": "",
            "ctx": {}
          },
          {
            "loc": [
              7682,
              "string"
            ],
            "msg": "string",
            "type": "string",
            "input": "",
            "ctx": {}
          }
        ]
      }
order: 2000
