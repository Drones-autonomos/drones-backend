$kind: http-request
description: Retorna el detalle completo de un evento junto con sus detecciones y enlaces a los frames de evidencia visual.
url: "{{baseUrl}}/api/v1/events/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  id: "{{event_id}}"
auth:
  type: oauth2
  credentials:
    accessTokenUrl: /api/v1/auth/login
    grant_type: password_credentials
settings: {}
examples: ./.resources/Obtener detalle de un evento.resources/examples
order: 2000
