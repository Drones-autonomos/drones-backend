$kind: http-request
description: Cancela misiones programadas o solicita interrupción con RTL.
  Requiere ADMIN o GUARDIA.
url: "{{baseUrl}}/api/v1/missions/:id/cancel"
method: POST
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: "{{mission_id}}"
    description: ""
auth:
  type: oauth2
  credentials:
    accessTokenUrl: /api/v1/auth/login
    grant_type: password_credentials
settings: {}
examples: .resources/Cancelar misión.resources/examples
order: 6000
