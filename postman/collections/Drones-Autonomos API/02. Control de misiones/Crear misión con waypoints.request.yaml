$kind: http-request
description: Crea una misión y registra sus waypoints de ruta en una sola transacción. Requiere rol ADMIN.
url: "{{baseUrl}}/api/v1/missions/"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Patrullaje Perimetral E2E",
      "descripcion": "Misión de prueba automatizada",
      "horario_inicio_programado": "2026-12-01T14:00:00Z",
      "peso_dron_kg": 2.5,
      "waypoints": [
        {
          "orden_waypoint": 1,
          "latitud": 20.5905,
          "longitud": -100.4135,
          "altitud_metros": 35.0
        },
        {
          "orden_waypoint": 2,
          "latitud": 20.5915,
          "longitud": -100.4125,
          "altitud_metros": 40.0
        }
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{admin_token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Misión creada\", () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));\r

      pm.collectionVariables.set(\"mission_id\", pm.response.json().id);"
    language: text/javascript
settings: {}
examples: ./.resources/Crear misión con waypoints.resources/examples
order: 1000
