$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/drone/rtl"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
