$kind: http-request
url: "{{baseUrl}}/api/v1/drone/takeoff"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "altitude": 10
    }
auth:
  type: oauth2
  credentials:
    accessTokenUrl: /api/v1/auth/login
    grant_type: password_credentials
settings: {}
examples: ./.resources/Takeoff Drone.resources/examples
order: 1000
