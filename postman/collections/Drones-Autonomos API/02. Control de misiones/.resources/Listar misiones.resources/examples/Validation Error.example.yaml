$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/missions/?estado=string&skip=0&limit=50"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
  queryParams:
    - key: estado
      value: string
      description: "Estado: PROGRAMADA, EN_CURSO, CANCELANDO, FINALIZADA, CANCELADA, FALLIDA o RECUPERACION"
    - key: skip
      value: "0"
      description: Registros a saltar
    - key: limit
      value: "50"
      description: Límite por página
response:
  statusCode: 422
  statusText: Unprocessable Entity (WebDAV) (RFC 4918)
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "detail": [
          {
            "loc": [
              3174,
              "string"
            ],
            "msg": "string",
            "type": "string",
            "input": "",
            "ctx": {}
          },
          {
            "loc": [
              7682,
              "string"
            ],
            "msg": "string",
            "type": "string",
            "input": "",
            "ctx": {}
          }
        ]
      }
order: 2000
