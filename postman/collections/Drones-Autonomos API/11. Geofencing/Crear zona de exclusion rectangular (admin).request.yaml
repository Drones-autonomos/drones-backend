$kind: http-request
url: "{{baseUrl}}/api/v1/geofences/"
method: POST
body:
  type: json
  content: "{\r

    \  \"nombre\": \"Zona Restringida Centro\",\r

    \  \"lat_min\": 20.5800,\r

    \  \"lat_max\": 20.5950,\r

    \  \"lon_min\": -100.4000,\r

    \  \"lon_max\": -100.3850,\r

    \  \"activa\": true\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{admin_token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status 201 - Zona de exclusión creada\", function () {\r

      \    pm.response.to.have.status(201);\r

      \    const jsonData = pm.response.json();\r

      \    pm.collectionVariables.set(\"geofence_id\", jsonData.id);\r

      });"
    language: text/javascript
order: 1000
