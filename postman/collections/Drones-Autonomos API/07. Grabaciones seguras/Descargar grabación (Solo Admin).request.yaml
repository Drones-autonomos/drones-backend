$kind: http-request
url: "{{baseUrl}}/api/v1/recordings/:id/download"
method: GET
headers:
  Accept: application/json
pathVariables:
  id: "{{recording_id}}"
auth:
  type: oauth2
  credentials:
    accessTokenUrl: /api/v1/auth/login
    grant_type: password_credentials
settings: {}
examples: ./.resources/Descargar grabación (Solo Admin).resources/examples
order: 4000
