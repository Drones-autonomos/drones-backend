$kind: http-request
url: http://localhost:8000/api/v1/auth/login
method: POST
body:
  type: json
  content: "{\r

    \    \"email\": \"guardia@facultad.edu.mx\",\r

    \    \"password\": \"PasswordSegura123!\"\r

    }"
scripts:
  - type: afterResponse
    code: "// Verificar status 200\r

      pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      // Extraer el access_token y guardarlo automáticamente en la variable de entorno\r

      const response = pm.response.json();\r

      if (response.access_token) {\r

      \    pm.environment.set(\"jwt_token\", response.access_token);\r

      \    console.log(\"JWT token guardado en el entorno correctamente.\");\r

      }\r

      const data = pm.response.json();\r

      if (data.access_token) {\r

      \    pm.environment.set(\"guardia_token\", data.access_token);\r

      \    console.log(\"Token de Guardia guardado en el entorno.\");\r

      }"
    language: text/javascript
order: 2000
