[tool.ruff]
# Directorio raíz del código a inspeccionar
src = ["app"]
line-length = 120
target-version = "py311"

# Excluir carpetas y archivos autogenerados
exclude = [
    ".venv",
    "__pycache__",
    "alembic",
    ".git"
]

[tool.ruff.lint]
# Reglas a habilitar:
# E / W: Errores y Warnings de pycodestyle (PEP 8)
# F: Pyflakes (imports no usados, variables no definidas)
# I: isort (orden automático de imports)
# B: flake8-bugbear (bugs comunes)
# UP: pyupgrade (modernización de sintaxis en Python 3.11+)
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
# Directorio de tests y patrones
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Modo de asyncio (strict = requiere marcar cada test async explícitamente)
asyncio_mode = "strict"

# Opciones de salida
addopts = "-v --tb=short --no-header"